name: Keep Supabase Alive

on:
  schedule:
    - cron: '0 8 * * 1,4'
  workflow_dispatch:

jobs:
  ping-database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - run: npm install
        working-directory: server
      - run: node test-connection.js
        working-directory: server
        env:
          DATABASE_URL: ${{ secrets.DATABASE_URL }}