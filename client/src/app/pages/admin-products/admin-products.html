<main class="admin-products-page container">
    <div class="admin-container">
        <div class="admin-heading">
            <h1>All Products</h1>
            <button class="add-btn" routerLink="/admin/products/new">New Product</button>
        </div>
        <div class="admin-table-wrapper">
            <table class="admin-table">
                <thead>
                    <tr>
                        <th>Image</th>
                        <th>Name</th>
                        <th>SKU</th>
                        <th>Price</th>
                        <th>Category</th>
                        <th>Status</th>
                        <th></th>
                    </tr>
                </thead>
                <tbody>
                    @for (product of products(); track product.id) {
                        <tr>
                            <td class="img-cell">
                                <img 
                                class="product-thumbnail"
                                [src]="product.image_url"
                                [alt]="product.name"
                                />    
                            </td>
                            <td data-label="Name">{{ product.name }}</td>
                            <td data-label="SKU">{{ product.sku }}</td>
                            <td data-label="Price">{{ product.price }}</td>
                            <td data-label="Category">{{ product.category_name }}</td>
                            <td data-label="Status">
                                <span
                                class="status-icon"
                                [class.published]="isPublished(product.published_date)"
                                [class.scheduled]="!isPublished(product.published_date)"
                                [title]="product.published_date">
                                </span>
                            </td>
                            <td class="actions">
                                <button
                                    class="delete-button"
                                    (click)="onDelete(product.id)"
                                    aria-label="Delete Product">
                                    <span class="material-symbols-outlined">delete</span>
                                </button>
                            </td>
                        </tr>
                    }
                </tbody>
                
            </table>
        </div>
    </div>
</main>
